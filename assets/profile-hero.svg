<svg width="1200" height="390" viewBox="0 0 1200 390" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">x-fherd — self-directed Python developer</title>
  <desc id="desc">A dark minimal systems composition representing a path from a question through building and learning.</desc>

  <defs>
